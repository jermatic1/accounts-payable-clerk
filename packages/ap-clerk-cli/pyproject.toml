[project]
name = "ap-clerk-cli"
version = "0.1.0"
description = "CLI frontend for accounts payable invoice processing"
requires-python = ">=3.12"
dependencies = [
    "ap-clerk-core",
]

[project.scripts]
ap-clerk = "ap_clerk_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ap_clerk_cli"]

[tool.uv.sources]
ap-clerk-core = { workspace = true }
