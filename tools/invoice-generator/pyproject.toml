[project]
name = "invoice-generator"
version = "0.1.0"
description = "Generate sample vendor invoice PDFs for test fixtures"
requires-python = ">=3.12"
dependencies = [
    "pypdf>=5.0.0",
    "reportlab>=5.0.0",
]

[project.scripts]
generate-invoices = "invoice_generator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/invoice_generator"]
