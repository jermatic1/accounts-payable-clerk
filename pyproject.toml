[project]
name = "accounts-payable-clerk"
version = "0.1.0"
description = "Accounts payable invoice processing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "basedpyright>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
src = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.basedpyright]
include = ["tests"]
exclude = ["**/__pycache__", "**/.venv", ".venv"]
typeCheckingMode = "standard"
reportMissingTypeStubs = "warning"
