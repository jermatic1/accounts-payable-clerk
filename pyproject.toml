[project]
name = "accounts-payable-clerk"
version = "0.1.0"
description = "Accounts payable invoice processing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "tools/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "basedpyright>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
markers = [
    "integration: live network tests (require config.toml with real VLM key)",
]

[tool.ruff]
src = [
    "packages/*/src",
    "tools/invoice-generator/src",
    "tests",
]
extend-exclude = ["poc", "plans"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.basedpyright]
include = ["packages", "tools", "tests"]
exclude = ["**/__pycache__", "**/.venv", ".venv"]
typeCheckingMode = "standard"
reportMissingTypeStubs = "warning"
