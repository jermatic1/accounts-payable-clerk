name: CI

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install Task
        uses: go-task/setup-task@v1
        with:
          version: 3.x

      - name: Check
        run: task check
