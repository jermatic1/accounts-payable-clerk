version: "3"

use_gitignore: true

tasks:
  init:
    desc: Install runtime dependencies
    method: checksum
    sources:
      - uv.lock
      - pyproject.toml
      - packages/*/pyproject.toml
      - tools/*/pyproject.toml
    generates:
      - .venv/.task-uv-sync
    cmds:
      - uv sync --all-packages --no-dev --inexact
      - touch .venv/.task-uv-sync

  init:dev:
    desc: Install runtime + dev tools (pytest, ruff, basedpyright)
    method: checksum
    sources:
      - uv.lock
      - pyproject.toml
      - packages/*/pyproject.toml
      - tools/*/pyproject.toml
    generates:
      - .venv/.task-uv-sync-dev
    cmds:
      - uv sync --all-packages
      - touch .venv/.task-uv-sync-dev

  lint:
    desc: Ruff lint, ruff format check, and basedpyright
    deps: [init:dev]
    cmds:
      - uv run ruff check .
      - uv run ruff format --check .
      - uv run basedpyright --warnings

  format:
    desc: Auto-fix lint issues and format code
    deps: [init:dev]
    cmds:
      - uv run ruff check --fix .
      - uv run ruff format .

  test:
    desc: Run tests
    deps: [init:dev]
    cmds:
      - uv run pytest || [ $? -eq 5 ]

  check:
    desc: Full gate — lint + tests
    deps: [init:dev]
    cmds:
      - task: lint
      - uv run pytest || [ $? -eq 5 ]

  extract-invoice:
    desc: Extract invoice data via ap-clerk CLI
    deps: [init:dev]
    cmds:
      - uv run --package ap-clerk-cli ap-clerk {{.CLI_ARGS}}

  generate-invoices:
    desc: Generate invoice PDF fixtures from vendors/POs
    deps: [init:dev]
    cmds:
      - uv run --package invoice-generator generate-invoices

